[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openvsp-mcp"
version = "0.1.0"
description = "MCP stdio server for OpenVSP geometry building and VSPAERO analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenVSP R2 Project" }]
keywords = ["openvsp", "vspaero", "mcp", "model-context-protocol", "aerodynamics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Physics",
]
# Deliberately no third-party dependencies: the server is standard-library only.
# The OpenVSP Python API (imported lazily from the OpenVSP installation) itself
# requires numpy, and optional report generation uses python-docx when present.
dependencies = []

[project.scripts]
openvsp-mcp = "openvsp_mcp_server:main"

[tool.setuptools]
py-modules = ["openvsp_mcp_server"]

[tool.setuptools.package-data]
openvsp_mcp_server = ["*.md"]
